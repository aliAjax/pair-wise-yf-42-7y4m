<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>繁育协调看板</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    h1 { font-size: 1.5rem; }
    section.cycle { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
    section.cycle h2 { margin-top: 0; font-size: 1.15rem; }
    section.cycle h3 { font-size: 1rem; color: #4b5563; margin-bottom: .4rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { border: 1px solid #e5e7eb; padding: .4rem .6rem; text-align: left; font-size: .9rem; }
    th { background: #f9fafb; }
    .badge { display: inline-block; padding: .1rem .45rem; border-radius: 999px; font-size: .78rem; background: #e5e7eb; }
    .badge.proposed { background: #dbeafe; }
    .badge.approved { background: #d1fae5; }
    .badge.rejected { background: #fee2e2; }
    .badge.completed { background: #ede9fe; }
    .badge.quarantined, .badge.deceased, .badge.missing { background: #fecaca; color: #7f1d1d; }
    .hint { color: #b91c1c; font-size: .82rem; }
    .ok { color: #047857; font-size: .82rem; }
    ul.occupancy { margin: .2rem 0 0; padding-left: 1.2rem; font-size: .9rem; }
    small { color: #6b7280; }
    button { padding: .4rem .8rem; cursor: pointer; }
    #updated { color: #6b7280; font-size: .85rem; margin-left: .6rem; }
  </style>
</head>
<body>
<main>
  <h1>繁育协调看板</h1>
  <p>按繁育周期展示配对建议与档期占用，供协调员现场判断。
    <button onclick="loadBoard()">刷新</button><span id="updated"></span></p>
  <div id="cycles">加载中…</div>
</main>
<script>
const STATUS_LABELS = {
  proposed: '待审批', approved: '已批准', rejected: '已驳回', completed: '已完成',
  active: '在册', quarantined: '隔离中', deceased: '死亡', missing: '记录缺失'
};

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function badge(status) {
  return el('span', STATUS_LABELS[status] || status, 'badge ' + status);
}

function animalCell(parent) {
  const td = el('td');
  if (!parent) { td.textContent = '—'; return td; }
  td.appendChild(el('span', (parent.name || parent.id) + ' '));
  td.appendChild(badge(parent.status));
  td.appendChild(el('small', ' ' + parent.id));
  return td;
}

function suggestionHints(entry, occupiedBy) {
  const hints = [];
  if (entry.status !== 'proposed') return hints;
  if (!entry.sire || !entry.dam) {
    hints.push('待指定亲本');
    return hints;
  }
  for (const parent of [entry.sire, entry.dam]) {
    const holder = occupiedBy[parent.id];
    if (holder) hints.push('档期冲突：' + (parent.name || parent.id) + ' 已被 ' + holder + ' 占用');
    if (parent.status !== 'active') hints.push('亲本异常：' + (parent.name || parent.id) + ' ' + (STATUS_LABELS[parent.status] || parent.status));
  }
  return hints;
}

function renderCycle(cycle) {
  const section = el('section', null, 'cycle');
  section.appendChild(el('h2', '周期 ' + cycle.cycle));

  section.appendChild(el('h3', '配对建议'));
  const table = el('table');
  const head = el('tr');
  for (const label of ['建议编号', '状态', '场馆', '公', '母', '提示']) head.appendChild(el('th', label));
  table.appendChild(head);
  const occupiedBy = {};
  for (const occ of cycle.occupancy) occupiedBy[occ.animal_id] = occ.pairing_id;
  for (const entry of cycle.suggestions) {
    const tr = el('tr');
    tr.appendChild(el('td', entry.id));
    const statusTd = el('td');
    statusTd.appendChild(badge(entry.status));
    tr.appendChild(statusTd);
    tr.appendChild(el('td', entry.venue || '—'));
    tr.appendChild(animalCell(entry.sire));
    tr.appendChild(animalCell(entry.dam));
    const hintTd = el('td');
    const hints = suggestionHints(entry, occupiedBy);
    if (hints.length) {
      for (const hint of hints) {
        hintTd.appendChild(el('div', hint, hint === '待指定亲本' ? null : 'hint'));
      }
    } else if (entry.status === 'proposed') {
      hintTd.appendChild(el('span', '可批准', 'ok'));
    } else {
      hintTd.textContent = '—';
    }
    tr.appendChild(hintTd);
    table.appendChild(tr);
  }
  section.appendChild(table);

  section.appendChild(el('h3', '同期占用'));
  if (cycle.occupancy.length) {
    const list = el('ul', null, 'occupancy');
    for (const occ of cycle.occupancy) {
      list.appendChild(el('li', (occ.animal_name || occ.animal_id) + '（' + occ.animal_id + '）→ 占用编号 ' + occ.pairing_id + (occ.venue ? '，场馆 ' + occ.venue : '')));
    }
    section.appendChild(list);
  } else {
    section.appendChild(el('p', '暂无占用', 'ok'));
  }
  return section;
}

async function loadBoard() {
  const container = document.getElementById('cycles');
  try {
    const response = await fetch('/api/overview');
    const payload = await response.json();
    container.textContent = '';
    const cycles = payload.cycles || [];
    if (!cycles.length) {
      container.textContent = '暂无配对建议。';
    } else {
      for (const cycle of cycles) container.appendChild(renderCycle(cycle));
    }
    document.getElementById('updated').textContent = '更新于 ' + new Date().toLocaleTimeString();
  } catch (err) {
    container.textContent = '加载失败：' + err;
  }
}

loadBoard();
</script>
</body>
</html>
